<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>イレウス CT Viewer</title>
<style>
body{margin:0;background:#101820;color:white;font-family:sans-serif}
header{padding:15px;background:#1c2935;position:sticky;top:0}
h2{font-size:19px;margin:0 0 12px}
select,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #526273;background:#263746;color:white}
select{width:48%}
#viewer{height:60vh;background:black;display:flex;align-items:center;justify-content:center}
#ct{max-width:100%;max-height:100%;object-fit:contain}
.controls{display:flex;gap:8px;padding:12px}
.controls button{flex:1}
input{width:95%;margin:12px 2.5%;accent-color:#55aaff}
p{text-align:center;color:#bbb;font-size:14px}
</style>
</head>
<body>

<header>
<h2>腸閉塞・イレウス CT Viewer</h2>
<select id="course">
<option value="resident">RESIDENT</option>
<option value="expert">EXPERT</option>
</select>
<select id="case"></select>
</header>

<div id="viewer">
<img id="ct" alt="CT画像">
</div>

<p id="info">読み込み中</p>

<input type="range" id="slider" min="1" max="30" value="1">

<div class="controls">
<button onclick="changeSlice(-1)">◀ 前へ</button>
<button onclick="togglePlay()" id="play">▶ 再生</button>
<button onclick="changeSlice(1)">次へ ▶</button>
</div>

<div class="controls">
<button onclick="changeCase(-1)">前の症例</button>
<button onclick="changeCase(1)">次の症例</button>
</div>

<script>
const course=document.getElementById("course");
const caseSelect=document.getElementById("case");
const ct=document.getElementById("ct");
const slider=document.getElementById("slider");
const info=document.getElementById("info");
const play=document.getElementById("play");

let slice=1;
let timer=null;
let maxSlice=30;

for(let i=1;i<=100;i++){
 const op=document.createElement("option");
 op.value=i;
 op.textContent="症例 "+i;
 caseSelect.appendChild(op);
}

function pageID(){
 const n=Number(caseSelect.value)-1;
 return course.value==="resident" ? 1383+n : 1388+n;
}

function imageURL(n){
 return "https://qqct.sakura.ne.jp/images/seminar/"
 +pageID()+"/q_"+n+"_1.jpg";
}

function loadImage(){
 ct.src=imageURL(slice);
 slider.value=slice;
 info.textContent=
 course.value.toUpperCase()+"｜症例 "+caseSelect.value+
 "｜画像 "+slice;
}

function changeSlice(n){
 slice=Math.max(1,Math.min(maxSlice,slice+n));
 loadImage();
}

function changeCase(n){
 stopPlay();
 let c=Number(caseSelect.value)+n;
 c=Math.max(1,Math.min(100,c));
 caseSelect.value=c;
 slice=1;
 maxSlice=30;
 slider.max=30;
 loadImage();
}

function togglePlay(){
 if(timer){
  stopPlay();
  return;
 }
 play.textContent="⏸ 停止";
 timer=setInterval(()=>{
  if(slice>=maxSlice){
   stopPlay();
  }else{
   changeSlice(1);
  }
 },700);
}

function stopPlay(){
 if(timer) clearInterval(timer);
 timer=null;
 play.textContent="▶ 再生";
}

ct.onerror=()=>{
 info.textContent="画像を読み込めません。画像番号または症例番号を確認してください。";
};

slider.oninput=()=>{
 stopPlay();
 slice=Number(slider.value);
 loadImage();
};

course.onchange=()=>{
 caseSelect.value=1;
 changeCase(0);
};

caseSelect.onchange=()=>{
 changeCase(0);
};

let startX=0;
document.getElementById("viewer").addEventListener("touchstart",e=>{
 startX=e.touches[0].clientX;
},{passive:true});

document.getElementById("viewer").addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].clientX-startX;
 if(Math.abs(dx)>35) changeSlice(dx<0?1:-1);
},{passive:true});

loadImage();
</script>
</body>
</html>
