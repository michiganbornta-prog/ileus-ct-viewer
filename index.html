<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#172633">

<title>腸閉塞・イレウス CT Viewer</title>

<style>

:root{color-scheme:dark;--bg:#0b1118;--panel:#1c2b38;--line:#405361;--text:#f4f7fa;--muted:#b7c3cc;--accent:#65b5ff}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}

header{position:sticky;top:0;z-index:5;background:#1c2b38;padding:16px 14px 14px;border-bottom:1px solid var(--line)}

h1{font-size:20px;margin:0 0 14px}

.selectors{display:grid;grid-template-columns:1fr 1fr;gap:8px}

select,button{font:inherit;color:var(--text);background:#263947;border:1px solid #526675;border-radius:10px;padding:11px;min-height:46px}

main{max-width:900px;margin:auto;padding:12px}

#status{text-align:center;color:var(--muted);font-size:14px;min-height:22px;margin:4px 0 10px}

#viewer{height:min(58vh,650px);min-height:300px;background:#000;display:flex;align-items:center;justify-content:center;border-radius:10px;overflow:hidden;touch-action:pan-y}

#ct{display:block;max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}

#message{display:none;text-align:center;padding:24px;color:#ffd6a0;line-height:1.6}

.range{width:100%;margin:20px 0 8px;accent-color:var(--accent)}

#counter{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}

.row{display:flex;gap:8px;margin:10px 0}

.row button{flex:1}

button.primary{background:#145b91;border-color:#287fba}

button:disabled{opacity:.4}

.note{font-size:12px;color:var(--muted);line-height:1.6;margin:16px 2px}

</style>

</head>

<body>

<header>

<h1>腸閉塞・イレウス CT Viewer</h1>

<div class="selectors">

<select id="course" aria-label="コース">

<option value="resident">RESIDENT</option>

<option value="expert">EXPERT</option>

</select>

<select id="case" aria-label="症例"></select>

</div>

</header>

<main>

<div id="status">画像枚数を確認しています…</div>

<div id="viewer">

<img id="ct" alt="CT画像">

<div id="message"></div>

</div>

<input class="range" id="slider" type="range" min="1" max="1" value="1">

<div id="counter">画像 1 / 1</div>

<div class="row">

<button id="prev">◀ 前へ</button>

<button class="primary" id="play">▶ 再生</button>

<button id="next">次へ ▶</button>

</div>

<div class="row">

<button id="prevCase">前の症例</button>

<button id="nextCase">次の症例</button>

</div>

<div class="note">

画像は元サイト qqct.sakura.ne.jp から直接読み込みます。症例ごとの画像枚数を自動確認して、最後の画像で停止します。画像の読み込みに失敗した場合は、通信状況を確認して再読み込みしてください。

</div>

</main>

<script>

(() => {

 const courseEl=document.getElementById('course');

 const caseEl=document.getElementById('case');

 const img=document.getElementById('ct');

 const message=document.getElementById('message');

 const status=document.getElementById('status');

 const slider=document.getElementById('slider');

 const counter=document.getElementById('counter');

 const playBtn=document.getElementById('play');

 const prevBtn=document.getElementById('prev');

 const nextBtn=document.getElementById('next');

 let slice=1;

 let maxSlice=1;

 let timer=null;

 let scanToken=0;

 for(let n=1;n<=100;n++){

   const op=document.createElement('option');

   op.value=String(n);

   op.textContent=`症例 ${n}`;

   caseEl.appendChild(op);

 }

 // RESIDENT症例1=1383、EXPERT症例1=1388

 function pageId(){

   const first=courseEl.value==='resident'?1383:1388;

   return first+(Number(caseEl.value)-1);

 }

 function urlFor(n){

   return `https://qqct.sakura.ne.jp/images/seminar/${pageId()}/q_${n}_1.jpg`;

 }

 function preload(url){

   return new Promise(resolve=>{

     const probe=new Image();

     probe.onload=()=>resolve(true);

     probe.onerror=()=>resolve(false);

     probe.src=url;

   });

 }

 async function detectImageCount(token){

   status.textContent='この症例の画像枚数を確認しています…';

   let count=0;

   for(let n=1;n<=100;n++){

     if(token!==scanToken)return;

     const ok=await preload(urlFor(n));

     if(!ok)break;

     count=n;

   }

   if(token!==scanToken)return;

   maxSlice=count;

   if(count===0){

     img.style.display='none';

     message.style.display='block';

     message.textContent='画像を読み込めませんでした。通信状況を確認して再読み込みしてください。';

     status.textContent=`${courseEl.value.toUpperCase()}｜症例 ${caseEl.value}`;

     slider.max=1;

     slider.value=1;

     counter.textContent='画像なし';

     return;

   }

   message.style.display='none';

   img.style.display='block';

   slice=1;

   slider.max=String(maxSlice);

   loadCurrent();

 }

 function loadCurrent(){

   img.src=urlFor(slice);

   slider.value=String(slice);

   counter.textContent=`画像 ${slice} / ${maxSlice}`;

   status.textContent=`${courseEl.value.toUpperCase()}｜症例 ${caseEl.value}`;

   prevBtn.disabled=slice<=1;

   nextBtn.disabled=slice>=maxSlice;

 }

 function stopPlay(){

   if(timer)clearInterval(timer);

   timer=null;

   playBtn.textContent='▶ 再生';

 }

 function setSlice(n){

   slice=Math.max(1,Math.min(maxSlice,n));

   loadCurrent();

 }

 function togglePlay(){

   if(timer){

     stopPlay();

     return;

   }

   if(maxSlice<=1)return;

   playBtn.textContent='⏸ 停止';

   timer=setInterval(()=>{

     if(slice>=maxSlice){

       stopPlay();

       return;

     }

     setSlice(slice+1);

   },650);

 }

 async function changeCase(){

   stopPlay();

   scanToken++;

   const token=scanToken;

   slice=1;

   img.removeAttribute('src');

   img.style.display='none';

   message.style.display='none';

   await detectImageCount(token);

 }

 document.getElementById('prev').onclick=()=>{

   stopPlay();

   setSlice(slice-1);

 };

 document.getElementById('next').onclick=()=>{

   stopPlay();

   setSlice(slice+1);

 };

 playBtn.onclick=togglePlay;

 document.getElementById('prevCase').onclick=()=>{

   caseEl.value=String(Math.max(1,Number(caseEl.value)-1));

   changeCase();

 };

 document.getElementById('nextCase').onclick=()=>{

   caseEl.value=String(Math.min(100,Number(caseEl.value)+1));

   changeCase();

 };

 slider.oninput=()=>{

   stopPlay();

   setSlice(Number(slider.value));

 };

 courseEl.onchange=()=>{

   caseEl.value='1';

   changeCase();

 };

 caseEl.onchange=changeCase;

 img.onerror=()=>{

   img.style.display='none';

   message.style.display='block';

   message.textContent='画像を表示できません。通信状況を確認してください。';

 };

 let touchStartX=null;

 const viewer=document.getElementById('viewer');

 viewer.addEventListener('touchstart',e=>{

   if(e.touches.length===1){

     touchStartX=e.touches[0].clientX;

   }

 },{passive:true});

 viewer.addEventListener('touchend',e=>{

   if(touchStartX===null)return;

   const dx=e.changedTouches[0].clientX-touchStartX;

   if(Math.abs(dx)>35){

     stopPlay();

     setSlice(slice+(dx<0?1:-1));

   }

   touchStartX=null;

 },{passive:true});

 changeCase();

})();

</script>

</body>

</html>
